<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bella's AI 日報｜行銷 × 品牌視角的 AI 趨勢判讀</title>
<meta name="description" content="Bella's AI 日報：從數位行銷與品牌策略視角，每日整理 AI 產業動態、工具更新與趨勢觀察，附上可執行的行銷判讀。">
<style>
    :root {
      --ink: #201C18;
      --ink-2: #2C2620;
      --cream: #F1E9D8;
      --paper: #FBF6EC;
      --terracotta: #C1442F;
      --terracotta-ink: #8F311F;
      --khaki: #B99A55;
      --khaki-bg: #EBDFBE;
      --frame-bg: #F3E7C7;
      --muted: #74695A;
      --line: #E0D3B4;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Masthead ── */
    .topbar { background: var(--ink); border-bottom: 3px solid var(--terracotta); }
    .topbar-inner {
      max-width: 1180px; margin: 0 auto; padding: 1rem 1.5rem;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1.5rem; flex-wrap: wrap;
    }
    .brand { display: flex; align-items: center; gap: 0.75rem; text-decoration: none; cursor: pointer; }
    .brand-mark {
      background: var(--terracotta); color: #fff; font-weight: 800; font-size: 0.9rem;
      letter-spacing: 0.02em; padding: 0.4rem 0.6rem; line-height: 1;
      clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
    }
    .brand-text strong { display: block; color: #F5F0E6; font-size: 1.02rem; font-weight: 800; letter-spacing: 0.01em; }
    .brand-text small { display: block; color: #9C9186; font-size: 0.68rem; letter-spacing: 0.08em; text-transform: uppercase; margin-top: 2px; }
    .date-picker { display: flex; align-items: center; gap: 0.5rem; }
    .date-picker label { display: flex; align-items: center; gap: 0.35rem; font-size: 0.68rem; color: #9C9186; }
    .date-picker select {
      appearance: none; background: var(--ink-2); border: 1px solid #4A4136; color: #F5F0E6;
      font-family: "SF Mono", Menlo, monospace; font-size: 0.78rem; padding: 0.35rem 0.55rem; border-radius: 4px;
    }

    /* ── Shell ── */
    .shell {
      max-width: 1180px; margin: 0 auto; padding: 2rem 1.5rem 5rem;
      display: grid; grid-template-columns: 300px 1fr; gap: 2rem; align-items: start;
    }

    /* ── Sidebar / Today's Signal ── */
    .signal {
      position: sticky; top: 1.5rem; background: var(--paper); border: 1px solid var(--line);
      border-radius: 4px; padding: 1.6rem 1.5rem; overflow: hidden;
    }
    .signal::before {
      content: ''; position: absolute; top: 0; right: 0; width: 46px; height: 46px;
      background: var(--terracotta); clip-path: polygon(100% 0, 0 0, 100% 100%);
    }
    .eyebrow { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.18em; text-transform: uppercase; color: var(--terracotta-ink); margin: 0 0 0.7rem; }
    .signal-title { font-size: 1.1rem; font-weight: 800; line-height: 1.55; margin: 0 0 1.1rem; text-wrap: balance; padding-right: 1rem; min-height: 1.5em; }
    .meta-grid {
      display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem 0.6rem; padding: 1rem 0;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-bottom: 1.2rem;
    }
    .meta-grid dt { font-size: 0.64rem; color: var(--muted); letter-spacing: 0.04em; margin-bottom: 2px; }
    .meta-grid dd { margin: 0; font-size: 0.8rem; font-weight: 600; font-family: "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }

    .section-nav { display: flex; flex-direction: column; gap: 0.5rem; margin-bottom: 1.3rem; }
    .section-nav a {
      font-size: 0.8rem; font-weight: 600; color: var(--ink); text-decoration: none;
      padding: 0.5rem 0.7rem; border-radius: 3px; background: var(--khaki-bg); border-left: 3px solid var(--khaki);
    }
    .section-nav a:hover { border-left-color: var(--terracotta); }

    .action-list-title { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.06em; color: var(--ink); margin: 0 0 0.6rem; text-transform: uppercase; }
    .action-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0.55rem; }
    .action-list li { font-size: 0.75rem; line-height: 1.6; color: var(--muted); padding-left: 1rem; position: relative; }
    .action-list li::before { content: ''; position: absolute; left: 0; top: 0.4em; width: 6px; height: 6px; background: var(--terracotta); }

    /* ── Main content ── */
    .content { min-width: 0; }

    .tag-filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .tag-filter-label { font-size: 0.68rem; font-weight: 800; letter-spacing: 0.06em; color: var(--muted); text-transform: uppercase; margin-right: 0.3rem; }
    .tag-filter-bar .chip {
      font-size: 0.72rem; padding: 0.3rem 0.75rem; border-radius: 999px; background: var(--khaki-bg);
      color: #6B5726; font-weight: 600; cursor: pointer; border: 1px solid transparent;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }
    .tag-filter-bar .chip:hover { border-color: var(--khaki); }
    .tag-filter-bar .chip.active { background: var(--terracotta-ink); color: #F8F2E6; }
    .tag-filter-bar .chip-reset { background: transparent; border: 1px solid var(--line); color: var(--muted); }

    .section-block { margin-bottom: 2.75rem; scroll-margin-top: 1.5rem; }
    .section-head {
      display: flex; align-items: baseline; gap: 0.8rem; margin-bottom: 1.1rem;
      padding-bottom: 0.6rem; border-bottom: 3px solid var(--ink);
    }
    .section-head h2 { font-size: 1.1rem; font-weight: 800; margin: 0; letter-spacing: 0.01em; }
    .section-count { font-size: 0.7rem; color: #fff; background: var(--terracotta); padding: 0.15rem 0.55rem; border-radius: 3px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .article-list { display: flex; flex-direction: column; gap: 1.1rem; }
    .article { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1.3rem 1.5rem; }
    .article-source { font-size: 0.7rem; color: var(--muted); margin: 0 0 0.4rem; }
    .article-source a { color: var(--terracotta-ink); text-decoration: none; }
    .article-source a:hover { text-decoration: underline; }
    .article-title { font-size: 0.98rem; font-weight: 700; line-height: 1.6; margin: 0 0 0.65rem; }
    .article-lede { font-size: 0.83rem; line-height: 1.85; color: var(--ink); margin: 0 0 0.85rem; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1rem; }
    .tag-row span {
      font-size: 0.68rem; background: var(--khaki-bg); color: #6B5726; padding: 0.2rem 0.6rem;
      border-radius: 3px; font-weight: 600; cursor: pointer; transition: background 0.15s, color 0.15s;
    }
    .tag-row span:hover { background: var(--khaki); color: #fff; }
    .tag-row span.active { background: var(--terracotta-ink); color: #F8F2E6; }

      border-radius: 3px; padding: 1.3rem 1.4rem 1.35rem 1.5rem; margin-top: 0.3rem; overflow: hidden;
    }
    .frame::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--terracotta-ink); }
    .frame-eyebrow {
      display: flex; align-items: center; gap: 0.5rem; font-size: 0.66rem; font-weight: 800;
      letter-spacing: 0.16em; text-transform: uppercase; color: var(--terracotta-ink); margin: 0 0 1rem;
    }
    .frame-eyebrow::before { content: ''; width: 7px; height: 7px; background: var(--terracotta-ink); transform: rotate(45deg); flex-shrink: 0; }
    .frame-rows { display: flex; flex-direction: column; gap: 0.95rem; }
    .frame-row { display: grid; grid-template-columns: 108px 1fr; gap: 1rem; }
    .frame-row + .frame-row { padding-top: 0.95rem; border-top: 1px solid rgba(143,49,31,0.16); }
    .frame-row .lab { font-size: 0.74rem; font-weight: 800; letter-spacing: 0.05em; color: var(--terracotta-ink); }
    .frame-row .lab small { display: block; font-size: 0.62rem; font-weight: 400; color: #8A7355; margin-top: 3px; letter-spacing: 0; }
    .frame-row .val { font-size: 0.84rem; line-height: 1.85; color: #2E2416; }

    .no-results { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; }

    .app-section-desc { font-size: 0.82rem; color: var(--muted); line-height: 1.8; margin: -0.5rem 0 1.3rem; }
    .app-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .app-card { background: var(--paper); border: 1px solid var(--line); border-radius: 4px; padding: 1.2rem 1.4rem; }
    .app-card h3 { font-size: 0.9rem; font-weight: 800; color: var(--terracotta-ink); margin: 0 0 0.6rem; }
    .app-card p { font-size: 0.82rem; line-height: 1.85; color: var(--ink); margin: 0; }

    /* ── Footer ── */
    .site-footer { background: var(--ink); border-top: 3px solid var(--terracotta); margin-top: 3rem; }
    .footer-inner { max-width: 1180px; margin: 0 auto; padding: 1.8rem 1.5rem 2.2rem; }
    .footer-notice { font-size: 0.74rem; line-height: 1.85; color: #B7AE9F; max-width: 62ch; margin: 0 0 1rem; }
    .footer-meta {
      display: flex; flex-wrap: wrap; align-items: center; gap: 0.5rem 0.9rem; padding-top: 1rem;
      border-top: 1px solid #3A342B; font-size: 0.72rem; color: #8B8175; font-family: "SF Mono", Menlo, monospace;
    }
    .footer-meta strong { color: #D9A971; font-family: inherit; font-weight: 700; }
    .footer-meta .sep { color: #4A4136; }

    @media (max-width: 720px) {
      .shell { grid-template-columns: 1fr; }
      .signal { position: static; }
      .frame-row { display: block; }
      .frame-row .lab { display: flex; align-items: baseline; gap: 0.5em; margin-bottom: 0.35rem; }
      .frame-row .lab small { display: inline; margin-top: 0; }
      .frame-row .val { display: block; }
      .app-grid { grid-template-columns: 1fr; }
      .topbar-inner { gap: 0.8rem; }
      .date-picker { flex-wrap: wrap; }
    }
</style>
</head>

    <dl class="meta-grid">
      <div><dt>日報日期</dt><dd id="metaReportDate">—</dd></div>
      <div><dt>資料日期</dt><dd id="metaDataDate">—</dd></div>
      <div><dt>生成時間</dt><dd id="metaGeneratedAt">—</dd></div>
      <div><dt>收錄則數</dt><dd id="metaCount">—</dd></div>
    </dl>

    <nav class="section-nav" id="sectionNav" aria-label="區塊導覽"></nav>

    <div id="actionListWrap" style="display:none">
      <p class="action-list-title">本日行動清單</p>
      <ul class="action-list" id="actionList"></ul>
    </div>
  </aside>

  <div class="content">
    <div class="tag-filter-bar" id="tagFilterBar" style="display:none"></div>
    <div id="sections">
      <p class="no-results">載入中…</p>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="footer-inner">
    <p class="footer-notice">本站內容為 AI 趨勢整理、評論與行銷應用解讀；新聞來源與原文著作權屬各原媒體與作者所有。若需完整內容，請閱讀原文。</p>

      <span>2026/08/19</span>
    </div>
  </div>
</footer>

<script>
const SECTIONS = [
  { key: 'big_news',     id: 'big-news',     label: '大事件' },
  { key: 'tool_updates', id: 'tool-updates', label: '工具動態' },
  { key: 'trends',       id: 'trends',       label: '趨勢觀察' },
];

let manifest = [];
let activeTag = null;

const yearSelect  = document.getElementById('yearSelect');
const monthSelect = document.getElementById('monthSelect');
const daySelect   = document.getElementById('daySelect');

async function init() {
  try {
    const res = await fetch('digests/manifest.json');
    manifest = await res.json();
  } catch (e) {
    showError('無法載入日報清單，請確認 digests/manifest.json 存在。');
    return;
  }
  if (!Array.isArray(manifest) || !manifest.length) {
    showError('目前還沒有任何日報。');
    return;
  }
  manifest.sort((a, b) => b.date_key.localeCompare(a.date_key));

  yearSelect.addEventListener('change', () => {
    const y = yearSelect.value;
    const m = monthsAvailable(y)[0];
    const d = daysAvailable(y, m)[0];
    loadDate(y + m + d);
  });
  monthSelect.addEventListener('change', () => {
    const y = yearSelect.value, m = monthSelect.value;
    const d = daysAvailable(y, m)[0];
    loadDate(y + m + d);
  });
  daySelect.addEventListener('change', () => {
    loadDate(yearSelect.value + monthSelect.value + daySelect.value);
  });
  document.getElementById('brandLink').addEventListener('click', (e) => {
    e.preventDefault();
    loadDate(manifest[0].date_key);
  });
  window.addEventListener('popstate', () => {
    loadDate(resolveDateKeyFromUrl(), { pushState: false });
  });

  loadDate(resolveDateKeyFromUrl(), { pushState: false, scroll: false });
}

function resolveDateKeyFromUrl() {
  const urlDate = new URLSearchParams(location.search).get('d');
  return (urlDate && manifest.some(m => m.date_key === urlDate)) ? urlDate : manifest[0].date_key;
}

function yearsAvailable() {
  return [...new Set(manifest.map(m => m.date_key.slice(0, 4)))].sort().reverse();
}
function monthsAvailable(year) {
  return [...new Set(manifest.filter(m => m.date_key.slice(0, 4) === year).map(m => m.date_key.slice(4, 6)))].sort().reverse();
}
function daysAvailable(year, month) {
  return manifest
    .filter(m => m.date_key.slice(0, 4) === year && m.date_key.slice(4, 6) === month)
    .map(m => m.date_key.slice(6, 8))
    .sort()
    .reverse();
}

function populateDatePicker(dateKey) {
  const y = dateKey.slice(0, 4), mo = dateKey.slice(4, 6), da = dateKey.slice(6, 8);
  yearSelect.innerHTML = yearsAvailable().map(yr => `<option value="${yr}" ${yr === y ? 'selected' : ''}>${yr}</option>`).join('');
  monthSelect.innerHTML = monthsAvailable(y).map(m => `<option value="${m}" ${m === mo ? 'selected' : ''}>${m}</option>`).join('');
  daySelect.innerHTML = daysAvailable(y, mo).map(d => `<option value="${d}" ${d === da ? 'selected' : ''}>${d}</option>`).join('');
}

async function loadDate(dateKey, opts = {}) {
  const { pushState = true, scroll = true } = opts;
  let digest;
  try {
    const res = await fetch(`digests/${dateKey}.json`);
    if (!res.ok) throw new Error('not found');
    digest = await res.json();
  } catch (e) {
    showError(`找不到 ${dateKey} 的日報資料。`);
    return;
  }

  activeTag = null;
  populateDatePicker(dateKey);
  renderSignal(digest);
  buildTagFilterBar(digest);
  renderSections(digest);
  applyFilter();

  const url = new URL(location.href);
  if (dateKey === manifest[0].date_key) url.searchParams.delete('d');
  else url.searchParams.set('d', dateKey);
  if (pushState) history.pushState({ dateKey }, '', url);
  else history.replaceState({ dateKey }, '', url);

  if (scroll) {
    document.getElementById('top').scrollIntoView({ behavior: 'instant', block: 'start' });
  }
}

function formatDate(iso) { return iso ? iso.replaceAll('-', '/') : '—'; }

function renderSignal(d) {
  const total = SECTIONS.reduce((n, s) => n + (d[s.key] || []).length, 0);
  document.getElementById('signalEyebrow').textContent = `Today's Signal · ${formatDate(d.date)}`;
  document.getElementById('signalTitle').textContent = d.summary || '（今日無摘要）';
  document.getElementById('metaReportDate').textContent = formatDate(d.date);
  document.getElementById('metaDataDate').textContent = formatDate(d.data_date);
  document.getElementById('metaGeneratedAt').textContent = d.generated_at || '—';
  document.getElementById('metaCount').textContent = `${total} 則`;

  const navLinks = SECTIONS
    .filter(s => (d[s.key] || []).length)
    .map(s => `<a href="#${s.id}">${s.label} · ${d[s.key].length} 則</a>`);
  if (Array.isArray(d.applications) && d.applications.length) {
    navLinks.push(`<a href="#applications">應用切角彙整</a>`);
  }
  document.getElementById('sectionNav').innerHTML = navLinks.join('');

  const tips = (d.tips_summary || []).slice(0, 6);
  const wrap = document.getElementById('actionListWrap');
  if (tips.length) {
    wrap.style.display = '';
    document.getElementById('actionList').innerHTML = tips.map(t => `<li>${escapeHtml(t)}</li>`).join('');
  } else {
    wrap.style.display = 'none';
  }
}

function buildTagFilterBar(d) {
  const bar = document.getElementById('tagFilterBar');
  const allTags = new Set();
  SECTIONS.forEach(s => (d[s.key] || []).forEach(item => (item.tags || []).forEach(t => allTags.add(t))));
  if (!allTags.size) {
    bar.style.display = 'none';
    bar.innerHTML = '';
    return;
  }
  bar.style.display = '';
  bar.innerHTML =
    `<span class="tag-filter-label">依主題篩選</span>` +
    [...allTags].map(t => `<span class="chip" data-tag="${escapeAttr(t)}">${escapeHtml(t)}</span>`).join('') +
    `<span class="chip chip-reset" id="tagReset">清除篩選</span>`;
  bar.querySelectorAll('.chip[data-tag]').forEach(chip => {
    chip.addEventListener('click', () => toggleTag(chip.dataset.tag));
  });
  document.getElementById('tagReset').addEventListener('click', () => toggleTag(null));
}

function toggleTag(tag) {
  activeTag = (activeTag === tag) ? null : tag;
  applyFilter();
}

function applyFilter() {
  document.querySelectorAll('#tagFilterBar .chip[data-tag]').forEach(chip => {
    chip.classList.toggle('active', chip.dataset.tag === activeTag);
  });

  document.querySelectorAll('.section-block').forEach(section => {
    let visible = 0;
    section.querySelectorAll('.article').forEach(article => {
      let tags = [];
      try { tags = JSON.parse(article.dataset.tags || '[]'); } catch (e) {}
      const match = !activeTag || tags.includes(activeTag);
      article.style.display = match ? '' : 'none';
      if (match) visible++;
      article.querySelectorAll('.tag-row span').forEach(chip => {
        chip.classList.toggle('active', chip.dataset.tag === activeTag);
      });
    });
    const countEl = section.querySelector('.section-count');
    const total = countEl.dataset.total;
    countEl.textContent = activeTag ? `${visible} / ${total} 則` : `${total} 則`;
    section.style.display = (activeTag && visible === 0) ? 'none' : '';
  });
}

function renderSections(d) {
  const wrap = document.getElementById('sections');
  wrap.innerHTML = '';
  let any = false;
  SECTIONS.forEach(s => {
    const items = d[s.key] || [];
    if (!items.length) return;
    any = true;
    const section = document.createElement('section');
    section.className = 'section-block';
    section.id = s.id;
    section.innerHTML = `
      <div class="section-head">
        <h2>${s.label}</h2>
        <span class="section-count" data-total="${items.length}">${items.length} 則</span>
      </div>
      <div class="article-list"></div>
    `;
    const list = section.querySelector('.article-list');
    items.forEach(item => list.appendChild(buildArticleCard(item)));
    wrap.appendChild(section);
  });

  const apps = Array.isArray(d.applications) ? d.applications : [];
  if (apps.length) {
    any = true;
    const section = document.createElement('section');
    section.className = 'app-section';
    section.id = 'applications';
    section.innerHTML = `
      <div class="section-head">
        <h2>應用切角彙整</h2>
        <span class="section-count">${apps.length} 個面向</span>
      </div>
      <p class="app-section-desc">跨新聞統整今日 AI 趨勢，分別從品牌策略、數位行銷、內容行銷、社群應用、媒體廣告、團隊流程六大面向，提出策略判斷與具體應用起點。</p>
      <div class="app-grid"></div>
    `;
    const grid = section.querySelector('.app-grid');
    apps.forEach(app => {
      const card = document.createElement('div');
      card.className = 'app-card';
      card.innerHTML = `<h3>${escapeHtml(app.dimension || '')}</h3><p>${escapeHtml(app.content || '')}</p>`;
      grid.appendChild(card);
    });
    wrap.appendChild(section);
  }

  if (!any) {
    wrap.innerHTML = '<p class="no-results">這天沒有收錄內容。</p>';
  }
}

function buildArticleCard(item) {
  const el = document.createElement('article');
  el.className = 'article';
  const tags = Array.isArray(item.tags) ? item.tags : [];
  el.dataset.tags = JSON.stringify(tags);

  let sourceHtml = '';
  if (Array.isArray(item.source_urls) && item.source_urls.length) {
    const links = item.source_urls
      .map(s => `<a href="${escapeAttr(s.url)}" target="_blank" rel="noopener">${escapeHtml(s.name)}</a>`)
      .join('、');
    sourceHtml = `<p class="article-source">來源：${links}</p>`;
  }

  const tagRowHtml = tags.length
    ? `<div class="tag-row">${tags.map(t => `<span data-tag="${escapeAttr(t)}">${escapeHtml(t)}</span>`).join('')}</div>`
    : '';

  el.innerHTML = `
    ${sourceHtml}
    <h3 class="article-title">${escapeHtml(item.title || '')}</h3>
    ${item.content ? `<p class="article-lede">${escapeHtml(item.content)}</p>` : ''}
    ${tagRowHtml}
    ${buildFrame(item.tip)}
  `;

  el.querySelectorAll('.tag-row span').forEach(chip => {
    chip.addEventListener('click', () => toggleTag(chip.dataset.tag));
  });

  return el;
}

function buildFrame(tip) {
  if (!tip) return '';
  const cleaned = tip.replace(/^\s*💡\s*/, '').trim();
  const match = cleaned.match(/【What】([\s\S]*?)【So What】([\s\S]*?)【Now What】([\s\S]*)$/);
  if (!match) return '';
  const rows = [
    ['WHAT', '事件本質', match[1].trim()],
    ['SO WHAT', '影響判讀', match[2].trim()],
    ['NOW WHAT', '具體行動', match[3].trim()],
  ];
  const rowsHtml = rows
    .map(([en, zh, val]) => `<div class="frame-row"><div class="lab">${en}<small>${zh}</small></div><div class="val">${escapeHtml(val)}</div></div>`)
    .join('');
  return `<div class="frame"><p class="frame-eyebrow">行銷判讀</p><div class="frame-rows">${rowsHtml}</div></div>`;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
function escapeAttr(str) { return escapeHtml(str).replaceAll('"', '&quot;'); }

function showError(msg) {
  document.getElementById('sections').innerHTML = `<p class="no-results">${escapeHtml(msg)}</p>`;
}

init();
</script>
</body>
